<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GreenIQ — Home energy command centre</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231f7a4d'/%3E%3Ctext x='16' y='22' font-size='17' font-family='system-ui' font-weight='700' text-anchor='middle' fill='white'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="shell">
    <!-- Persistent left sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <a class="brand" href="#/overview">
        <span class="brand-mark">G</span>
        <span class="brand-text"><strong>GreenIQ</strong><small>Home energy command centre</small></span>
      </a>

      <div class="prop-switch" id="prop-switch">
        <button class="prop-btn" id="prop-btn" aria-haspopup="listbox" aria-expanded="false">
          <span class="prop-dot" id="prop-dot"></span>
          <span class="prop-label" id="prop-label">Choose a home…</span>
          <span class="prop-caret">⌄</span>
        </button>
        <div class="prop-pop" id="prop-pop" hidden></div>
      </div>

      <nav class="nav" id="nav" aria-label="Your home"></nav>

      <div class="sidebar-foot">
        <small id="data-status" class="data-status">—</small>
      </div>
    </aside>

    <!-- Main column -->
    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
        <div class="crumb" id="crumb"></div>
        <div class="topbar-right">
          <span class="llm-pill" id="llm-pill" title="AI provider">AI: —</span>
          <label class="obj-pick">
            <span class="muted small">Prioritise</span>
            <select class="inp sm" id="obj">
              <option value="value_for_money">Value for money</option>
              <option value="carbon">Most carbon saved</option>
              <option value="energy">Most energy saved</option>
            </select>
          </label>
          <button class="icon-btn" id="label-toggle" title="Toggle evidence labels" aria-pressed="false">🏷</button>
          <button class="icon-btn" id="theme-toggle" title="Theme">◐</button>
        </div>
      </header>

      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <aside class="drawer" id="drawer" aria-label="How this number was worked out" hidden></aside>
  <div class="drawer-scrim" id="drawer-scrim" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
