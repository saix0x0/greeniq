<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GreenIQ</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%231f7a4d'/><text x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='sans-serif'>G</text></svg>">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="logo"><span class="logo-mark">G</span>GreenIQ</div>
      <nav class="nav">
        <a href="#/" data-nav="dashboard"><span class="ic">◆</span>Dashboard</a>
        <a href="#/properties" data-nav="properties"><span class="ic">⌂</span>Properties</a>
        <a href="#/lab" data-nav="lab" class="hero-nav"><span class="ic">⚡</span>Decision Lab</a>
        <a href="#/analytics" data-nav="analytics"><span class="ic">◴</span>Analytics</a>
        <a href="#/evidence" data-nav="evidence"><span class="ic">✓</span>Evidence</a>
      </nav>
      <div class="side-sep"></div>
      <div class="side-foot">
        <div class="mode">
          <div class="mode-row"><span id="mode-label">Evidence mode</span>
            <button class="switch" id="mode-switch" role="switch" aria-checked="true" aria-label="Evidence mode"></button></div>
          <small id="mode-help">Every number shows its evidence tag; click a dotted number for its receipt.</small>
        </div>
        <nav class="nav"><a href="#/settings" data-nav="settings"><span class="ic">⚙</span>Settings</a></nav>
      </div>
    </aside>
    <main class="main" id="main"><div class="loading">Loading…</div></main>
  </div>
  <div class="tip" id="tip"></div>
  <aside class="drawer" id="drawer" aria-label="Receipt"></aside>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
