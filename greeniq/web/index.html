<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GreenIQ — Green Home Score</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231f7a4d'/%3E%3Ctext x='16' y='22' font-size='17' font-family='system-ui' font-weight='700' text-anchor='middle' fill='white'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#/" title="Start again">
        <span class="brand-mark">G</span>
        <span><strong>GreenIQ</strong><small>Green Home Score · every number shows how it was worked out</small></span>
      </a>
      <nav class="seg" aria-label="View">
        <a data-nav="home" href="#/home">One home</a>
        <a data-nav="homes" href="#/homes">Many homes</a>
      </nav>
      <form class="find" id="find" role="search">
        <input id="find-q" placeholder="Home reference" autocomplete="off" aria-label="Home reference">
        <button class="nav-btn primary" type="submit">Open</button>
      </form>
      <nav class="topbar-actions">
        <a class="nav-btn" data-nav="how" href="#/how">How it works</a>
        <button class="nav-btn icon" id="menu-btn" aria-haspopup="true" aria-expanded="false" title="Settings">⚙</button>
        <div class="menu" id="menu" hidden>
          <label class="menu-row"><span><b>Show evidence labels</b><small>Write “measured”, “estimate”, “assumed” next to numbers instead of a coloured dot.</small></span>
            <button class="switch" id="src-switch" role="switch" aria-checked="false" aria-label="Show evidence labels"></button></label>
          <label class="menu-row col"><b>“Do this first” should favour</b>
            <select class="inp" id="obj">
              <option value="value_for_money">Value for money (carbon saved per £)</option>
              <option value="carbon">Most carbon saved</option>
              <option value="energy">Most energy saved</option>
            </select></label>
          <label class="menu-row col"><b>Theme</b>
            <select class="inp" id="theme"><option value="system">Match my device</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
        </div>
      </nav>
    </header>
    <main id="main"></main>
  </div>
  <div class="tip" id="tip" role="tooltip"></div>
  <aside class="drawer" id="drawer" aria-label="How this number was worked out"></aside>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
