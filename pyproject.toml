[project]
name = "greeniq"
version = "0.1.0"
description = "GreenIQ: Green Home Score & Retrofit Recommendation Engine (Lloyds Megathon X, Problem Statement 2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pydantic>=2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
greeniq = "greeniq.cli:main"

[project.optional-dependencies]
llm = [
    "anthropic>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["greeniq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "pytest>=9.1.1",
]
